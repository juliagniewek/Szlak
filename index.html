<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Blokada sieci (N1): przeglądarka nie wyśle żadnego żądania z danymi i nie wczyta obcego skryptu.
     Jedyne zewnętrzne żądania to zdjęcia z Wikimedia Commons. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://upload.wikimedia.org; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin">
<title>szlak.</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<div class="aplikacja">
  <!-- Menu wypełnia src/widoki/menu.js (aktywna sekcja wynika z adresu #/...). -->
  <nav class="menu" id="menu" aria-label="Główna nawigacja"></nav>

  <main>
    <div class="tresc">
      <p class="logo logo-gora">szlak<span>.</span></p>
      <p id="ostrzezenie" class="komunikat" role="alert" hidden></p>
      <div id="widok"></div>
      <div id="stopka"></div>
    </div>
  </main>
</div>
<!-- Okno szczegółów miejsca (E3); treść z src/widoki/miejsce.js. -->
<dialog id="okno" class="okno" aria-labelledby="okno-tytul"></dialog>
<noscript><p class="komunikat">Aplikacja wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
